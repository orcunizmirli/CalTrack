name: Forkcast
options:
  bundleIdPrefix: com.forkcast
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  Forkcast:
    type: application
    platform: iOS
    sources:
      - CalTrack
    settings:
      base:
        INFOPLIST_FILE: CalTrack/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.forkcast.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: "YES"
    entitlements:
      path: CalTrack/CalTrack.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access:
          - health-records
    info:
      properties:
        CFBundleDisplayName: Forkcast
