name: Forkcast
options:
  bundleIdPrefix: com.forkcast
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  Forkcast:
    type: application
    platform: iOS
    sources:
      - CalTrack
      - path: ForkcastWidget/SharedData.swift
    settings:
      base:
        INFOPLIST_FILE: CalTrack/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.forkcast.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: "YES"
        CODE_SIGN_ENTITLEMENTS: CalTrack/CalTrack.entitlements
    dependencies:
      - target: ForkcastWidget
        embed: true

  ForkcastWidget:
    type: app-extension
    platform: iOS
    sources:
      - ForkcastWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forkcast.app.widget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        SWIFT_EMIT_LOC_STRINGS: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Forkcast Widget"
        CODE_SIGN_ENTITLEMENTS: ForkcastWidget/ForkcastWidget.entitlements
